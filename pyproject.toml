[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-report-extractor"
version = "0.1.0"
description = "Staged medical document information extraction using a local Transformers VLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6.0",
  "transformers>=5.3.0",
  "accelerate>=1.0.0",
  "torchvision>=0.21.0",
  "python-dotenv>=1.0.1",
  "pymupdf>=1.24.0",
  "Pillow>=10.0.0",
  "pydantic>=2.7.0",
]

[project.scripts]
medical-report-extract = "medical_report_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
